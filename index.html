<style>
  :root {
    --fpt-orange: #F26522;
    --fpt-blue:   #003DA5;
    --fpt-green:  #00843D;
    --bg:         #F5F3EE;
    --surface:    #ffffff;
    --surface2:   #F0F2F8;
    --border:     #E2E6F0;
    --border2:    #C8CDE0;
    --text:       #1A1C2E;
    --text2:      #5A5F7A;
    --text3:      #9499B5;
    --accent:     #F26522;
    --accent-bg:  #FEF3EC;
    --green:      #00843D;
    --green-bg:   #E8F5EE;
    --amber:      #C47A00;
    --amber-bg:   #FEF8EC;
    --red:        #C0392B;
    --red-bg:     #FDECEC;
    --blue:       #003DA5;
    --blue-bg:    #EBF0FB;
    --purple:     #6B21A8;
    --purple-bg:  #F3E8FD;
    --radius:     8px;
    --radius-lg:  12px;
    --font:       'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: linear-gradient(135deg, #003DA5 0%, #0066CC 35%, #00843D 65%, #F26522 100%) !important; color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-wrap { width: 100%; max-width: 400px; padding: 24px; }
  .logo-area { text-align: center; margin-bottom: 28px; }
  .logo-mark { font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: 0.1em; }
  .logo-sub { font-size: 12px; color: var(--text3); margin-top: 4px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
  .card-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .card-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 5px; }
  input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--font); font-size: 13px; color: var(--text); outline: none; transition: border-color 0.15s; }
  input:focus { border-color: var(--accent); }
  .btn { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-family: var(--font); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; margin-top: 4px; }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .error-box { background: #fdf0f0; border: 1px solid #f0c0c0; border-radius: var(--radius); padding: 9px 12px; font-size: 12px; color: var(--red); margin-bottom: 14px; display: none; }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 5px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer-note { text-align: center; font-size: 11px; color: var(--text3); margin-top: 16px; }

</style>
</head>

  </div>
  
  <div class="card">
    <div class="card-title">Đăng nhập</div>
    <div class="card-sub">Dùng tài khoản được cấp bởi quản trị viên</div>
    <div class="error-box" id="error-box"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="email@fschools.vn" onkeydown="if(event.key==='Enter')login()">
    </div>
    <div class="field">
      <label>Mật khẩu</label>
      <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn" id="login-btn" onclick="login()">Đăng nhập</button>

  </div>
  <div class="footer-note">Quên mật khẩu? Liên hệ quản trị viên</div>
</div>

<script>
// Backend mới (Cloudflare Pages Functions + Supabase) — cùng domain nên dùng path tương đối.
// Bản cũ (Google Apps Script) không còn dùng ở bản deploy này (xem PROGRESS.md).
const APPS_SCRIPT_URL = '/api';


async function login() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errBox   = document.getElementById('error-box');
  const btn      = document.getElementById('login-btn');

  if (!email || !password) {
    showError('Vui lòng nhập email và mật khẩu'); return;
  }

  btn.innerHTML = '<span class="spinner"></span>Đang đăng nhập...';
  btn.disabled = true;
  errBox.style.display = 'none';

  try {
    const res = await callAPI({ action: 'login', email, password });
    if (res.ok) {
      // Lưu session — dùng localStorage (không phải sessionStorage) để mọi tab/cửa sổ
      // trên cùng trình duyệt đều nhận ra đã đăng nhập, kể cả tab mới mở từ link trong mail.
      localStorage.setItem('fsc_user', JSON.stringify(res.user));
      localStorage.setItem('fsc_token', res.token || '');
      // Chuyển hướng theo role, giữ lại ?open=ID nếu người dùng đến từ link trong mail
      const role = res.user.role;
      const openId = new URLSearchParams(window.location.search).get('open');
      const suffix = openId ? ('?open=' + encodeURIComponent(openId)) : '';
      if (role === 'ctv' || role === 'leader_content') {
        window.location.href = 'ctv.html' + suffix;
      } else if (role === 'admin' || role === 'manager' || role === 'leader') {
        window.location.href = 'boss.html' + suffix;
      }
    } else {
      showError(res.error || 'Đăng nhập thất bại');
    }
  } catch(e) {
    showError('Lỗi kết nối. Thử lại sau.');
  }

  btn.innerHTML = 'Đăng nhập';
  btn.disabled = false;
}

function showError(msg) {
  const b = document.getElementById('error-box');
  b.textContent = '⚠️ ' + msg;
  b.style.display = 'block';
}

async function callAPI(data, _retryCount) {
  _retryCount = _retryCount || 0;
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(data)
    });
    return await res.json();
  } catch(e) {
    // Đăng nhập chỉ đọc dữ liệu (kiểm tra email/mật khẩu) — an toàn để tự thử lại khi mất kết nối
    if (_retryCount < 2) {
      await new Promise(r => setTimeout(r, 900 * (_retryCount + 1)));
      return callAPI(data, _retryCount + 1);
    }
    throw e;
  }
}

// Lưu ý: không tự xoá session khi vào trang này nữa — vì session giờ dùng chung
// (localStorage) cho mọi tab, xoá vô điều kiện ở đây sẽ đăng xuất luôn các tab khác
// đang mở. Đăng xuất chỉ xảy ra khi bấm nút "Đăng xuất" (hàm logout() ở ctv.html/boss.html).
</script>
